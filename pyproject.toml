[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panoagent"
version = "0.1.0"
description = "Leakage-safe direct MLLM and agentic fact-checking pipelines for PanoFND"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
frames = ["av", "Pillow"]
qwen = [
  "torch",
  "transformers==4.52.3",
  "accelerate",
  "qwen-omni-utils",
  "soundfile",
  "audioread",
  "av",
]
internvl = [
  "torch",
  "torchvision",
  "transformers==4.52.3",
  "accelerate",
  "einops",
  "timm",
  "sentencepiece",
  "Pillow",
  "av",
]
dev = ["pytest>=8"]

[project.scripts]
panoagent = "panoagent.cli:main"

[tool.setuptools.packages.find]
include = ["panoagent*"]
